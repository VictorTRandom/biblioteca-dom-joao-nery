services:
  - type: web
    name: biblioteca-dom-joao-nery-api
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-dom-joao-nery-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_DATA
        value: "false"
databases:
  - name: biblioteca-dom-joao-nery-db
    databaseName: biblioteca
    region: oregon
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
