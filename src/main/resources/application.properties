spring.application.name=biblioteca-escolar
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/biblioteca}
spring.datasource.username=${DB_USER:biblioteca}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=8000
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
server.port=${PORT:8080}
server.servlet.session.cookie.name=BIBLIOTECA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
biblioteca.admin-email=${ADMIN_EMAIL:}
biblioteca.admin-password=${ADMIN_PASSWORD:}
biblioteca.demo=${DEMO_DATA:false}
